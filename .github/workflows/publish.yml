name: Publish Maat UI
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      verify_only:
        description: Test installation of an already published tag
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify tag matches package version
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm catalog:build
      - name: Publish to npm
        if: ${{ !inputs.verify_only }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import manifest from './package.json' with { type: 'json' };
          const { name, version } = manifest;
          const metadata = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (metadata.status === 404) {
            execFileSync('npm', ['publish', '--access', 'public'], { stdio: 'inherit' });
          } else {
            if (!metadata.ok) throw new Error(`npm registry returned ${metadata.status}`);
            const published = await metadata.json();
            const [local] = JSON.parse(execFileSync('npm', ['pack', '--ignore-scripts', '--json'], { encoding: 'utf8' }));
            if (published.dist.integrity !== local.integrity) throw new Error('Published package differs from this tag');
          }
          NODE
      - name: Install exact version anonymously
        working-directory: ${{ runner.temp }}
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          export NPM_CONFIG_USERCONFIG=/dev/null
          export NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          mkdir maat-consumer && cd maat-consumer
          printf '%s\n' '{"name":"maat-consumer","private":true}' > package.json
          # Different registry caches can see a newly published version at different times.
          for attempt in {1..30}; do
            if pnpm add --store-dir ./store --save-exact "@raulaguila/maat-ui@${RELEASE_TAG#v}" > install.log 2>&1; then
              cat install.log
              break
            fi
            cat install.log
            if [[ "$attempt" == 30 ]]; then
              exit 1
            fi
            if ! grep -q 'ERR_PNPM_NO_MATCHING_VERSION' install.log &&
               ! grep -F 'ERR_PNPM_FETCH_404' install.log | grep -Fq "/maat-ui/-/maat-ui-${RELEASE_TAG#v}.tgz:"; then
              exit 1
            fi
            sleep 10
          done
          node -e "if (require('./package.json').dependencies['@raulaguila/maat-ui'] !== process.env.RELEASE_TAG.slice(1)) process.exit(1)"
          pnpm install --store-dir ./store --frozen-lockfile
          node --input-type=module -e "import { Button } from '@raulaguila/maat-ui/button'; if (!Button) process.exit(1)"
