name: Publish Maat UI
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      verify_only:
        description: Test installation of an already published tag
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@raulaguila'
          cache: pnpm
      - name: Verify tag matches package version
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm catalog:build
      - name: Publish to GitHub Packages
        if: ${{ !inputs.verify_only }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact version as a consumer
        working-directory: ${{ runner.temp }}
        run: |
          mkdir maat-consumer && cd maat-consumer
          printf '%s\n' '{"name":"maat-consumer","private":true}' > package.json
          pnpm add --save-exact "@raulaguila/maat-ui@${RELEASE_TAG#v}"
          node -e "if (require('./package.json').dependencies['@raulaguila/maat-ui'] !== process.env.RELEASE_TAG.slice(1)) process.exit(1)"
          pnpm install --frozen-lockfile
          node --input-type=module -e "import { Button } from '@raulaguila/maat-ui/button'; if (!Button) process.exit(1)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
